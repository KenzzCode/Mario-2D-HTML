<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Cube Bros - Turtle Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #60a5fa; font-family: 'Inter', sans-serif; touch-action: none; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        .ui-layer { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; }
        .interactive { pointer-events: auto; }
        .no-select { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="no-select">

<div id="game-canvas"></div>

<div class="ui-layer">
    <!-- HUD -->
    <div id="hud" class="flex justify-between items-start p-6 text-white font-bold opacity-0 hidden">
        <div class="bg-black/20 backdrop-blur-md p-4 rounded-2xl border border-white/10 shadow-xl">
            <div class="text-xs uppercase tracking-widest text-blue-200 mb-1">Kura-Kura</div>
            <div class="text-xl" id="hud-name">---</div>
        </div>
        <div class="text-right bg-black/20 backdrop-blur-md p-4 rounded-2xl border border-white/10 shadow-xl">
            <div class="text-xs uppercase tracking-widest text-yellow-200 mb-1">Scrolls</div>
            <div class="text-4xl text-yellow-400 font-black" id="hud-score">0000</div>
            <div id="hud-highscore" class="text-[10px] text-white/50 mt-1">BEST: 0</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="interactive absolute inset-0 flex items-center justify-center bg-blue-600/40 backdrop-blur-xl z-50">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl max-w-sm w-full text-center border-t-8 border-blue-500">
            <h1 class="text-5xl font-black text-slate-800 mb-2 tracking-tighter">CUBE BROS</h1>
            <p class="text-blue-500 font-bold text-sm tracking-widest mb-8">TURTLE EDITION</p>
            <div class="mb-6 text-left">
                <label class="block text-slate-400 font-bold mb-2 text-[10px] uppercase tracking-widest">Identity</label>
                <input class="w-full px-5 py-4 rounded-2xl bg-slate-100 border-2 border-transparent focus:border-blue-500 focus:bg-white focus:outline-none text-lg font-bold text-slate-800 transition-all" id="player-name" type="text" placeholder="Turtle Name" maxlength="12">
            </div>
            <button id="btn-start" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl shadow-lg shadow-blue-200 transform hover:-translate-y-1 transition-all active:scale-95 text-xl uppercase tracking-widest">Start Mission</button>
            <div class="mt-8 flex justify-center gap-4 text-slate-400">
                <div class="flex flex-col items-center">
                    <span class="bg-slate-100 px-2 py-1 rounded text-[10px] font-bold mb-1">A / D</span>
                    <span class="text-[9px]">MOVE</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="bg-slate-100 px-2 py-1 rounded text-[10px] font-bold mb-1">W / SPACE</span>
                    <span class="text-[9px]">JUMP</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="interactive absolute inset-0 flex items-center justify-center bg-slate-900/90 backdrop-blur-lg z-50 hidden opacity-0">
        <div class="text-center text-white p-8">
            <h2 class="text-6xl font-black text-white mb-2 tracking-tighter">OOF!</h2>
            <p class="text-red-400 font-bold tracking-widest mb-10">OOPS!</p>
            <div class="mb-12">
                <div class="text-slate-400 uppercase text-xs tracking-widest mb-2">Final Score</div>
                <div id="final-score" class="text-7xl font-black text-yellow-400">0</div>
            </div>
            <button id="btn-restart" class="bg-white text-slate-900 hover:bg-blue-50 font-black py-5 px-14 rounded-3xl shadow-2xl transform hover:scale-105 transition-all active:scale-95 text-xl uppercase tracking-widest">Try Again</button>
        </div>
    </div>
</div>

<script>
/** CONFIGURATION **/
const CONFIG = {
    gravity: -45,
    jumpForce: 18,
    moveSpeed: 12,
    acceleration: 90,
    friction: 65,
    airFriction: 20
};

const State = {
    isRunning: false,
    score: 0,
    highScore: parseInt(localStorage.getItem('cubebros_highscore')) || 0,
    playerName: "Kura",
    keys: { a: false, d: false, w: false }, // Fixed WASD keys
    lastTime: 0
};

/** THREE.JS SETUP **/
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x60a5fa);
scene.fog = new THREE.Fog(0x60a5fa, 20, 60);

const aspect = window.innerWidth / window.innerHeight;
const viewSize = 20;
const camera = new THREE.OrthographicCamera(-viewSize * aspect / 2, viewSize * aspect / 2, viewSize / 2, -viewSize / 2, 0.1, 1000);
camera.position.set(0, 6, 20);
camera.lookAt(0, 6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('game-canvas').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(10, 20, 15);
sun.castShadow = true;
scene.add(sun);

/** OBJECTS **/
let player;
let platforms = [];
let coins = [];
let enemies = [];
const platformBoxes = [];

const levelData = [
    { x: 0, y: -2, w: 40, h: 4 },
    { x: 45, y: -2, w: 15, h: 4 },
    { x: 70, y: -2, w: 25, h: 4 },
    { x: 105, y: 1, w: 8, h: 10 },
    { x: 130, y: -2, w: 40, h: 4 },
    { x: 15, y: 4, w: 4, h: 1 },
    { x: 24, y: 7, w: 4, h: 1 },
    { x: 50, y: 3, w: 6, h: 1 },
    { x: 80, y: 5, w: 8, h: 1 },
    { x: 90, y: 9, w: 4, h: 1 },
];

function initLevel() {
    platforms.forEach(p => scene.remove(p));
    coins.forEach(c => scene.remove(c.mesh));
    enemies.forEach(e => scene.remove(e.mesh));
    platforms = []; coins = []; enemies = []; platformBoxes.length = 0;

    const geoPlat = new THREE.BoxGeometry(1, 1, 2);
    const matPlat = new THREE.MeshStandardMaterial({ color: 0x475569 });
    const matTop = new THREE.MeshStandardMaterial({ color: 0x10b981 });

    levelData.forEach(d => {
        const mesh = new THREE.Mesh(geoPlat, matPlat);
        mesh.scale.set(d.w, d.h, 1);
        mesh.position.set(d.x, d.y, 0);
        mesh.receiveShadow = true;
        scene.add(mesh);
        platforms.push(mesh);
        platformBoxes.push(new THREE.Box3().setFromObject(mesh));

        const top = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 2.1), matTop);
        top.scale.set(d.w, 0.4, 1);
        top.position.set(d.x, d.y + d.h/2 + 0.1, 0);
        scene.add(top);
        platforms.push(top);

        if (Math.random() > 0.4) spawnCoins(d);
        if (d.w > 8 && d.y <= 0) spawnEnemy(d);
    });

    if (!player) createTurtlePlayer();
    resetPlayer();
}

function createTurtlePlayer() {
    player = {
        group: new THREE.Group(),
        vx: 0, vy: 0, w: 1, h: 1.2,
        isGrounded: false, direction: 1, isRunning: false, animTime: 0
    };

    const matShell = new THREE.MeshStandardMaterial({ color: 0x2d5a27 });
    const matSkin = new THREE.MeshStandardMaterial({ color: 0x8fbc8f });
    const matShellUnder = new THREE.MeshStandardMaterial({ color: 0xf5deb3 });

    // Shell (body) - using sphere for turtle shell
    const shell = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12, 0, Math.PI * 2, 0, Math.PI/2), matShell);
    shell.rotation.x = Math.PI;
    shell.position.y = 0.2;
    shell.castShadow = true;
    player.group.add(shell);

    // Shell underside
    const shellUnder = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.15, 16), matShellUnder);
    shellUnder.position.y = 0.05;
    player.group.add(shellUnder);

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), matSkin);
    head.position.set(0, 0.35, 0.4);
    player.group.add(head);

    // Eyes
    const matEye = new THREE.MeshStandardMaterial({ color: 0x000000 });
    const eyeGeo = new THREE.SphereGeometry(0.06, 8, 8);
    player.leftEye = new THREE.Mesh(eyeGeo, matEye);
    player.leftEye.position.set(-0.1, 0.4, 0.55);
    player.group.add(player.leftEye);

    player.rightEye = new THREE.Mesh(eyeGeo, matEye);
    player.rightEye.position.set(0.1, 0.4, 0.55);
    player.group.add(player.rightEye);

    // Legs (4 legs)
    const legGeo = new THREE.CapsuleGeometry(0.08, 0.2, 4, 8);
    player.legs = [];
    const legPositions = [
        { x: -0.35, z: 0.25, rot: Math.PI/4 },
        { x: 0.35, z: 0.25, rot: -Math.PI/4 },
        { x: -0.35, z: -0.25, rot: -Math.PI/4 },
        { x: 0.35, z: -0.25, rot: Math.PI/4 }
    ];
    legPositions.forEach((pos, i) => {
        const leg = new THREE.Mesh(legGeo, matSkin);
        leg.position.set(pos.x, -0.15, pos.z);
        leg.rotation.z = pos.rot;
        player.legs.push(leg);
        player.group.add(leg);
    });

    // Tail
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.25, 8), matSkin);
    tail.position.set(0, -0.1, -0.45);
    tail.rotation.x = Math.PI / 2;
    player.group.add(tail);

    scene.add(player.group);
}

function resetPlayer() {
    player.group.position.set(0, 5, 0);
    player.vx = 0; player.vy = 0;
}

function spawnCoins(plat) {
    const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 12);
    const mat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.7 });
    const count = Math.floor(Math.random() * 3) + 1;
    for(let i=0; i<count; i++) {
        const mesh = new THREE.Mesh(geo, mat);
        const x = (plat.x - plat.w/2) + (plat.w / (count+1)) * (i+1);
        mesh.position.set(x, plat.y + plat.h/2 + 2, 0);
        mesh.rotation.x = Math.PI / 2;
        scene.add(mesh);
        coins.push({ mesh, collected: false, offset: Math.random() * 10 });
    }
}

function spawnEnemy(plat) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
    mesh.position.set(plat.x, plat.y + plat.h/2 + 0.6, 0);
    scene.add(mesh);
    enemies.push({ mesh, dir: 1, speed: 4, range: [plat.x - plat.w/2 + 0.6, plat.x + plat.w/2 - 0.6] });
}

function checkAABB(pos, w, h) {
    const box = new THREE.Box3(
        new THREE.Vector3(pos.x - w/2, pos.y - h/2, -0.5),
        new THREE.Vector3(pos.x + w/2, pos.y + h/2, 0.5)
    );
    for (let p of platformBoxes) { if (box.intersectsBox(p)) return p; }
    return null;
}

/** UPDATES **/
function updatePhysics(dt) {
    if (!State.isRunning) return;

    // Horizontal Movement
    if (State.keys.a) { player.vx -= CONFIG.acceleration * dt; player.direction = -1; player.isRunning = true; }
    else if (State.keys.d) { player.vx += CONFIG.acceleration * dt; player.direction = 1; player.isRunning = true; }
    else {
        player.isRunning = false;
        const fric = player.isGrounded ? CONFIG.friction : CONFIG.airFriction;
        if (player.vx > 0) player.vx = Math.max(0, player.vx - fric * dt);
        if (player.vx < 0) player.vx = Math.min(0, player.vx + fric * dt);
    }
    player.vx = Math.max(-CONFIG.moveSpeed, Math.min(CONFIG.moveSpeed, player.vx));

    // Vertical Movement
    player.vy += CONFIG.gravity * dt;

    // Resolve X
    let nextX = player.group.position.x + player.vx * dt;
    let hitX = checkAABB({x: nextX, y: player.group.position.y}, player.w, player.h);
    if (hitX) { player.vx = 0; } else { player.group.position.x = nextX; }

    // Resolve Y
    let nextY = player.group.position.y + player.vy * dt;
    player.isGrounded = false;
    let hitY = checkAABB({x: player.group.position.x, y: nextY}, player.w, player.h);
    if (hitY) {
        if (player.vy < 0) {
            nextY = hitY.max.y + player.h/2;
            player.isGrounded = true;
        }
        player.vy = 0;
    }
    player.group.position.y = nextY;

    // Animations
    if (player.isRunning && player.isGrounded) {
        player.animTime += dt * 15;
        player.legs.forEach((leg, i) => {
            leg.rotation.x = Math.sin(player.animTime + (i % 2) * Math.PI) * 0.5;
        });
    } else {
        player.legs.forEach(leg => leg.rotation.x = 0);
    }
    player.group.rotation.y = player.direction === 1 ? 0 : Math.PI;

    if (player.group.position.y < -12) triggerGameOver();
}

function update(time) {
    requestAnimationFrame(update);
    const dt = Math.min((time * 0.001 - State.lastTime), 0.1);
    State.lastTime = time * 0.001;

    updatePhysics(dt);

    if (State.isRunning) {
        camera.position.x += (player.group.position.x + 5 - camera.position.x) * 4 * dt;

        coins.forEach(c => {
            if (c.collected) return;
            c.mesh.rotation.y += 3 * dt;
            if (player.group.position.distanceTo(c.mesh.position) < 1.5) {
                c.collected = true; State.score += 100;
                document.getElementById('hud-score').innerText = State.score.toString().padStart(4, '0');
                anime({ targets: c.mesh.scale, x:0, y:0, z:0, duration: 300, complete: () => scene.remove(c.mesh) });
            }
        });

        enemies.forEach(e => {
            e.mesh.position.x += e.dir * e.speed * dt;
            if (e.mesh.position.x > e.range[1] || e.mesh.position.x < e.range[0]) e.dir *= -1;
            if (player.group.position.distanceTo(e.mesh.position) < 1.3) triggerGameOver();
        });
    }
    renderer.render(scene, camera);
}

/** UI & EVENTS **/
function triggerGameOver() {
    if (!State.isRunning) return;
    State.isRunning = false;
    if (State.score > State.highScore) {
        State.highScore = State.score;
        localStorage.setItem('cubebros_highscore', State.highScore);
    }
    document.getElementById('final-score').innerText = State.score;
    const screen = document.getElementById('gameover-screen');
    screen.classList.remove('hidden');
    anime({ targets: screen, opacity: 1, duration: 500 });
}

document.getElementById('btn-start').addEventListener('click', () => {
    const name = document.getElementById('player-name').value.trim();
    State.playerName = name || "Ninja";
    document.getElementById('hud-name').innerText = State.playerName;
    document.getElementById('hud-highscore').innerText = `BEST: ${State.highScore}`;
    anime({ targets: '#start-screen', opacity: 0, duration: 400, complete: () => {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        anime({ targets: '#hud', opacity: 1, duration: 500 });
        State.score = 0;
        initLevel();
        State.isRunning = true;
    }});
});

document.getElementById('btn-restart').addEventListener('click', () => location.reload());

window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (key === 'a') State.keys.a = true;
    if (key === 'd') State.keys.d = true;
    if (key === 'w') State.keys.w = true; // WASD Support

    if ((key === 'w' || key === ' ' || key === 'arrowup') && player.isGrounded && State.isRunning) {
        player.vy = CONFIG.jumpForce;
        player.isGrounded = false;
        anime({ targets: player.group.scale, y: [1.4, 1], x: [0.7, 1], duration: 300 });
    }
});

window.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    if (key === 'a') State.keys.a = false;
    if (key === 'd') State.keys.d = false;
    if (key === 'w') State.keys.w = false;
    
    // Short jump logic
    if ((key === 'w' || key === ' ') && player.vy > 0) player.vy *= 0.4;
});

window.addEventListener('resize', () => {
    const aspect = window.innerWidth / window.innerHeight;
    camera.left = -viewSize * aspect / 2; camera.right = viewSize * aspect / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start
initLevel();
requestAnimationFrame(update);
</script>
</body>
</html>
